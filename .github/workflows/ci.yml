name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NGINX_VERSION: "1.30.1"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          #- beta
          #- nightly
    
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy
    
    - name: Cache dependencies
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: |
          ~/.cargo/cache
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.rust }}-
          ${{ runner.os }}-cargo-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libpcre3-dev zlib1g-dev libssl-dev
    
    - name: Download and build Nginx
      run: |
        wget http://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz
        tar -xzf nginx-${NGINX_VERSION}.tar.gz
        cd nginx-${NGINX_VERSION}
        ./configure \
          --prefix=/tmp/nginx \
          --with-compat \
          --with-file-aio \
          --with-http_addition_module \
          --with-http_auth_request_module \
          --with-http_dav_module \
          --with-http_flv_module \
          --with-http_gunzip_module \
          --with-http_gzip_static_module \
          --with-http_mp4_module \
          --with-http_random_index_module \
          --with-http_realip_module \
          --with-http_secure_link_module \
          --with-http_slice_module \
          --with-http_ssl_module \
          --with-http_stub_status_module \
          --with-http_sub_module \
          --with-http_v2_module \
          --with-stream \
          --with-stream_realip_module \
          --with-stream_ssl_module \
          --with-stream_ssl_preread_module \
          --with-threads
        make -j$(nproc)
        sudo make install
        echo "NGX_PATH=$(pwd)" >> $GITHUB_ENV

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: |
        export NGX_PATH=$(pwd)/nginx-${NGINX_VERSION}
        export NGINX_SOURCE_DIR=$(pwd)/nginx-${NGINX_VERSION}
        cargo clippy --all-targets --all-features -- -D warnings

    - name: Build
      run: |
        export NGX_PATH=$(pwd)/nginx-${NGINX_VERSION}
        export NGINX_SOURCE_DIR=$(pwd)/nginx-${NGINX_VERSION}
        cargo build --verbose

    - name: Run tests with nginx environment
      run: |
        export NGX_PATH=$(pwd)/nginx-${NGINX_VERSION}
        export NGINX_SOURCE_DIR=$(pwd)/nginx-${NGINX_VERSION}
        cargo test --lib --verbose

    - name: Build release
      run: |
        export NGX_PATH=$(pwd)/nginx-${NGINX_VERSION}
        export NGINX_SOURCE_DIR=$(pwd)/nginx-${NGINX_VERSION}
        cargo build --release --verbose

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-audit
      run: cargo install cargo-audit
    
    - name: Run security audit
      run: cargo audit

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
    
    - name: Install Rust 1.85
      uses: dtolnay/rust-toolchain@c93f4f9c67595668add93d3d6895795ce52d8c2d # 1.85.0
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libpcre3-dev zlib1g-dev libssl-dev
    
    - name: Download and build Nginx
      run: |
        wget http://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz
        tar -xzf nginx-${NGINX_VERSION}.tar.gz
        cd nginx-${NGINX_VERSION}
        ./configure --prefix=/tmp/nginx --with-compat
        make -j$(nproc)
        sudo make install

    - name: Check build with MSRV
      run: |
        export NGX_PATH=$(pwd)/nginx-${NGINX_VERSION}
        export NGINX_SOURCE_DIR=$(pwd)/nginx-${NGINX_VERSION}
        cargo build --verbose

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libpcre3-dev zlib1g-dev libssl-dev
    
    - name: Download and build Nginx
      run: |
        wget http://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz
        tar -xzf nginx-${NGINX_VERSION}.tar.gz
        cd nginx-${NGINX_VERSION}
        ./configure --prefix=/tmp/nginx --with-compat
        make -j$(nproc)
        sudo make install

    - name: Build documentation
      run: |
        export NGX_PATH=$(pwd)/nginx-${NGINX_VERSION}
        export NGINX_SOURCE_DIR=$(pwd)/nginx-${NGINX_VERSION}
        cargo doc --no-deps --document-private-items

    - name: Check for documentation warnings
      run: |
        export NGX_PATH=$(pwd)/nginx-${NGINX_VERSION}
        export NGINX_SOURCE_DIR=$(pwd)/nginx-${NGINX_VERSION}
        # Build docs and check for warnings, but don't fail on warnings for now
        cargo doc --no-deps 2>&1 | tee doc-output.log
        if grep -q "warning:" doc-output.log; then
          echo "Documentation warnings found:"
          grep "warning:" doc-output.log
          echo "Continuing build despite warnings..."
        fi

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-integration-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-integration-

    - name: Install system dependencies
      run: |
        # The runner image carries Microsoft apt repositories that intermittently
        # answer 403, and apt-get update fails as a whole when any source does.
        # None of them provide anything needed here.
        sudo rm -f /etc/apt/sources.list.d/microsoft*.list \
                   /etc/apt/sources.list.d/microsoft*.sources \
                   /etc/apt/sources.list.d/azure-cli.list \
                   /etc/apt/sources.list.d/azure-cli.sources
        sudo apt-get update
        sudo apt-get install -y build-essential libpcre3-dev zlib1g-dev libssl-dev cpanminus
        sudo cpanm --notest Test::Nginx

    # nginx has to be configured twice. Building the module needs the headers
    # and the generated ngx_auto_config.h, which only exist after configure has
    # run; nginx in turn has to link against the module, which only exists after
    # cargo has run. So: configure to lay down objs/, build the module, then
    # configure again with --add-module and compile for real.
    - name: Fetch and configure nginx
      run: |
        wget -q http://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz
        tar -xzf nginx-${NGINX_VERSION}.tar.gz
        cd nginx-${NGINX_VERSION}
        ./configure --with-compat

    - name: Build the module
      env:
        NGINX_SOURCE_DIR: ${{ github.workspace }}/nginx-1.30.1
      run: cargo build --release

    # Now nginx can be configured against the module that was just built.
    - name: Build nginx with the module
      working-directory: nginx-1.30.1
      run: |
        ./configure \
          --with-compat \
          --with-debug \
          --with-http_ssl_module \
          --with-http_stub_status_module \
          --add-module=${{ github.workspace }}
        make -j"$(nproc)"

    - name: Run the integration tests
      env:
        TEST_NGINX_BINARY: ${{ github.workspace }}/nginx-1.30.1/objs/nginx
      run: prove t/
