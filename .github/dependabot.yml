# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:

  # The workflows already pin actions to commit SHAs, which stops a moved tag
  # from changing what runs but also means nothing updates on its own.
  # Dependabot rewrites the SHA and its trailing version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # Cargo.lock is committed, so transitive dependencies and the ngx git
  # dependency are both visible here.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"
    groups:
      all-dependencies:
        patterns:
          - "*"
